<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style><?!= include('Styles') ?></style>
</head>
<body>
  <!-- Issue #409 P0: Notion-style shell. On a desktop the sidebar holds the
       brand, the view nav and the read time + refresh; on a phone the same
       sidebar is a slim top bar and the nav is fixed to the bottom of the
       screen. P1 adds 今天 (default) in front of the five existing views. -->
  <div class="ios-shell">
    <aside class="ios-sidebar">
      <div class="ios-brand">
        <span class="ios-brand-mark" aria-hidden="true">I</span>
        <span class="ios-brand-name">IOS 投资操作台</span>
      </div>
      <nav class="ios-tab-bar" id="ios-tab-bar" aria-label="视图">
        <button type="button" class="ios-tab-btn" id="ios-tab-today" onclick="selectTab('today')"><svg class="ios-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21H3z"/></svg><span class="ios-tab-label">今天</span></button>
        <button type="button" class="ios-tab-btn" id="ios-tab-todos" onclick="selectTab('todos')"><svg class="ios-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="ios-tab-label">待办</span></button>
        <button type="button" class="ios-tab-btn" id="ios-tab-daily" onclick="selectTab('daily')"><svg class="ios-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h5"/></svg><span class="ios-tab-label">日报</span></button>
        <button type="button" class="ios-tab-btn" id="ios-tab-weekly" onclick="selectTab('weekly')"><svg class="ios-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v15H4zM4 10h16M9 3v4M15 3v4"/></svg><span class="ios-tab-label">周报</span></button>
        <button type="button" class="ios-tab-btn" id="ios-tab-holdingDetail" onclick="selectTab('holdingDetail')"><svg class="ios-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="ios-tab-label">持仓明细</span></button>
        <button type="button" class="ios-tab-btn" id="ios-tab-risks" onclick="selectTab('risks')"><svg class="ios-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 17H3zM12 10v4M12 17v.5"/></svg><span class="ios-tab-label">风险</span></button>
      </nav>
      <div class="ios-sidebar-foot">
        <span class="ios-data-time" id="ios-data-time"></span>
        <button type="button" class="ios-refresh-btn" id="ios-refresh-btn" onclick="refresh()" title="重新读取 Sheet，无需刷新页面">刷新</button>
      </div>
    </aside>

    <div class="ios-main">
      <header class="ios-page-head">
        <h1 class="ios-page-title" id="ios-page-title"></h1>
        <div class="ios-topbar-controls">
          <select class="ios-history-select" id="ios-history-select" onchange="onHistorySelectChange(this.value)" title="跳转到历史报告" aria-label="历史报告"></select>
        </div>
      </header>

      <div id="ios-status-banner" class="ios-status-banner" hidden></div>
      <div id="ios-history-banner" class="ios-history-banner" hidden></div>

      <div id="ios-summary-content"></div>

      <div id="ios-view-banner" hidden></div>
      <main id="ios-tab-content"></main>
    </div>
  </div>

  <script>
    // Everything the client needs for its first paint, computed once by
    // doGet (see Code.gs) and embedded here so the page never shows a
    // blank/loading state on initial load -- only a later manual refresh
    // or history selection needs an actual google.script.run round trip.
    var IOS_BOOTSTRAP = <?!= bootstrapJson ?>;
    var IOS_ACTIVE_VIEW = <?!= JSON.stringify(activeView) ?>;
  </script>
  <script><?!= include('Script') ?></script>
</body>
</html>
